<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>askMartin</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }
    #stage { position: fixed; inset: 0; }

    /* --- Layer 1: Nils' live site (it burns my "Ja" into his "Nei") --- */
    #nils {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      transform-origin: 42% 50%; /* the point where the shark's mouth bites */
      will-change: transform, opacity;
    }
    /* The whole site — his "Nei" included — is sucked into the shark's mouth. */
    #nils.swallowed { animation: swallow 0.5s ease-in forwards; }
    @keyframes swallow {
      0%   { transform: scale(1)    rotate(0deg);   opacity: 1; }
      100% { transform: scale(0.02) rotate(-22deg); opacity: 0; }
    }

    /* --- Layer 2: the shark that eats it --- */
    /* The SVG faces left (mouth on the left edge), so swimming left the mouth leads. */
    #shark {
      position: absolute;
      top: 50%;
      left: 100%;
      width: 46vw;
      transform: translateY(-50%);
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.5));
      opacity: 0;
      will-change: left, transform;
    }
    #shark svg { width: 100%; height: auto; display: block; }
    .sharkSwim { animation: sharkSwim 2.2s cubic-bezier(0.3,0,0.4,1) forwards; }
    @keyframes sharkSwim {
      0%   { left: 108%; opacity: 0; transform: translateY(-50%) scale(1); }
      10%  { opacity: 1; }
      /* charges in until the open mouth reaches the site, and chomps... */
      42%  { left: 44%;  opacity: 1; transform: translateY(-50%) scale(1); }
      50%  { left: 40%;  opacity: 1; transform: translateY(-50%) scale(1.06); }
      /* ...then races off the left edge with its meal */
      100% { left: -60%; opacity: 1; transform: translateY(-50%) scale(1); }
    }

    /* --- Layer 3: back to a big "Ja" --- */
    #ja {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #000;
      font-size: 30vw;
      opacity: 0;
      pointer-events: none;
    }
    .jaOn { animation: jaIn 0.9s ease-out forwards; }
    @keyframes jaIn { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      #shark { display: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- 1. Show his site (it displays his "Nei"). -->
    <iframe id="nils" src="https://second.asknils.ch/" title="asknils" referrerpolicy="no-referrer"></iframe>

    <!-- 2. A shark swims in and eats the whole thing. -->
    <div id="shark" aria-label="shark">
      <svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
        <!-- body -->
        <path d="M20 95 C60 60 130 55 205 70 C230 40 255 28 278 26 C268 52 268 74 258 92
                 C270 104 282 118 292 138 C262 128 236 128 214 132
                 C150 150 70 142 30 118 C22 112 16 104 20 95 Z"
              fill="#5b6b78"/>
        <!-- belly -->
        <path d="M40 112 C110 138 175 142 232 128 C204 132 150 148 92 138 C70 134 52 124 40 112 Z"
              fill="#d7dee3"/>
        <!-- dorsal fin -->
        <path d="M150 60 C165 30 188 20 205 22 C196 40 190 56 188 66 C176 60 162 59 150 60 Z"
              fill="#4a5966"/>
        <!-- pectoral fin -->
        <path d="M120 118 C130 148 150 160 172 162 C158 146 150 130 148 118 C138 118 128 118 120 118 Z"
              fill="#4a5966"/>
        <!-- tail -->
        <path d="M258 92 C270 78 282 62 286 40 C290 70 288 96 292 138 C280 120 270 104 258 92 Z"
              fill="#4a5966"/>
        <!-- gills -->
        <g stroke="#3c4854" stroke-width="3" fill="none" stroke-linecap="round">
          <path d="M92 82 C88 92 88 104 92 116"/>
          <path d="M104 80 C100 92 100 106 104 118"/>
          <path d="M116 80 C112 92 112 106 116 120"/>
        </g>
        <!-- open mouth with teeth -->
        <path d="M20 95 C34 92 52 94 66 100 C54 110 36 116 22 118 C16 110 16 102 20 95 Z" fill="#2a333c"/>
        <path d="M24 97 l7 7 l7 -6 l7 7 l7 -6 l7 7" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
        <path d="M26 114 l7 -6 l7 6 l7 -6 l7 6" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
        <!-- eye -->
        <circle cx="74" cy="86" r="6" fill="#12181d"/>
        <circle cx="76" cy="84" r="2" fill="#fff"/>
      </svg>
    </div>

    <!-- 3. The big "Ja" is back. -->
    <div id="ja">Ja</div>
  </div>

  <script>
    // Timeline (ms). Let his site load and show its "Nei" first, then the shark eats it.
    const nils  = document.getElementById('nils');
    const shark = document.getElementById('shark');
    const ja    = document.getElementById('ja');

    const T = {
      shark: 4500,   // give his site time to load + burn my Ja into his Nei
      bite:  5450,   // the open mouth reaches the site and swallows it whole
      ja:    6800,   // the shark is gone; a big Ja fills the page
    };

    setTimeout(() => { shark.classList.add('sharkSwim'); }, T.shark);
    setTimeout(() => { nils.classList.add('swallowed'); }, T.bite);
    setTimeout(() => { ja.classList.add('jaOn'); }, T.ja);
  </script>
</body>
</html>
