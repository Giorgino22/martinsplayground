<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14111f">
  <title>Humm</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
  <style>
    :root {
      --bg: #14111f;
      --card: #1f1b2e;
      --line: #2e2943;
      --text: #f2effa;
      --muted: #9c95b5;
      --accent: #ff6b5c;
      --accent2: #ffb35c;
      --good: #4fd18b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 80px; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { margin: 0; font-size: 2.4rem; letter-spacing: -0.03em; }
    header h1 span { color: var(--accent); }
    header p { margin: 4px 0 0; color: var(--muted); }

    textarea, input[type=text] {
      width: 100%; font: inherit; color: var(--text);
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; resize: vertical;
    }
    textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 6px; }

    button {
      font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 999px;
      background: var(--card); color: var(--text); padding: 10px 18px;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #1a0f0d; font-weight: 600; }
    button.small { padding: 5px 12px; font-size: 0.85rem; }

    /* The big round record button. --level (0..1) is set from JS while recording,
       so the glow pulses with your voice. */
    .mic-area { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 28px 0 18px; }
    #mic {
      --level: 0;
      width: 132px; height: 132px; border-radius: 50%; padding: 0;
      border: none; background: linear-gradient(140deg, var(--accent), var(--accent2));
      color: #1a0f0d; font-size: 3rem;
      box-shadow: 0 0 0 calc(var(--level) * 34px) rgba(255, 107, 92, 0.25);
      transition: box-shadow 0.08s linear, transform 0.15s;
    }
    #mic:active { transform: scale(0.96); }
    #mic.recording { background: #fff; color: var(--accent); }
    #micLabel { color: var(--muted); font-size: 0.95rem; min-height: 1.5em; text-align: center; }

    .take { display: none; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line);
            border-radius: 14px; padding: 8px 10px; margin-bottom: 14px; }
    .take.show { display: flex; }
    .take audio { flex: 1; min-width: 0; height: 36px; }

    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .error { color: #ff8a80; text-align: center; min-height: 1.5em; margin: 10px 0 0; }

    /* Results */
    #results { margin-top: 28px; }
    .bubble { background: var(--line); border-radius: 14px 14px 4px 14px; padding: 8px 14px;
              margin: 22px 0 10px auto; width: fit-content; max-width: 85%; }
    .heard { color: var(--muted); font-style: italic; margin: 10px 0; }
    .guess { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 10px 0; }
    .guess .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .guess .title { font-weight: 700; font-size: 1.1rem; }
    .guess .artist { color: var(--muted); }
    .guess .pct { font-weight: 700; color: var(--accent2); white-space: nowrap; }
    .bar { height: 4px; background: var(--line); border-radius: 4px; margin: 8px 0; overflow: hidden; }
    .bar div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .guess .why { font-size: 0.92rem; margin: 6px 0 10px; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .links a { color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 999px;
               padding: 5px 12px; font-size: 0.85rem; }
    .links a.yt { border-color: #ff4e45; }
    .links a.sp { border-color: #1ed760; }
    .found { border-color: var(--good) !important; color: var(--good); }
    .question { border-left: 3px solid var(--accent2); padding: 4px 12px; margin: 14px 0; }
    .model { color: var(--muted); font-size: 0.75rem; text-align: right; margin: 4px 0 0; }
    .thinking { color: var(--muted); text-align: center; margin: 18px 0; }
    .thinking::after { content: ''; animation: dots 1.2s steps(4) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

    #followup { display: none; gap: 8px; margin-top: 16px; }
    #followup.show { display: flex; }
    #followup input { flex: 1; }

    /* History */
    #history { margin-top: 44px; }
    #history h2 { font-size: 1.05rem; color: var(--muted); font-weight: 600; }
    #history ul { list-style: none; padding: 0; margin: 0; }
    #history li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    #history li .info { flex: 1; min-width: 0; }
    #history li .date { color: var(--muted); font-size: 0.8rem; }
    #history li .del { background: none; border: none; color: var(--muted); font-size: 1.1rem; padding: 4px 8px; }
    .empty { color: var(--muted); font-size: 0.92rem; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Humm<span>.</span></h1>
    <p>Hum it, sing it, "na na na" it. Find the song.</p>
  </header>

  <label for="hint">What do you remember? (optional)</label>
  <textarea id="hint" rows="2" placeholder="e.g. Brazilian, World Cup song, lots of long O's, maybe 2014"></textarea>

  <div class="mic-area">
    <button id="mic" aria-label="Record">🎤</button>
    <div id="micLabel">Tap to record (up to 30 s)</div>
  </div>

  <div class="take" id="take">
    <audio id="player" controls></audio>
    <button class="small" id="discard">Delete</button>
  </div>

  <div class="actions">
    <button class="primary" id="find" disabled>Find the song</button>
    <button id="reset" style="display:none">New search</button>
  </div>
  <p class="error" id="error"></p>

  <section id="results"></section>
  <form id="followup">
    <input type="text" id="feedback" placeholder="Not it? e.g. &quot;older, more samba, a woman sings&quot;" autocomplete="off">
    <button class="primary" type="submit">Send</button>
  </form>

  <section id="history">
    <h2>Songs you found</h2>
    <ul id="historyList"></ul>
  </section>
</div>

<script>
  const MAX_SECONDS = 30;
  const $ = id => document.getElementById(id);

  // Everything about the current search lives here.
  const state = {
    audio: null,      // base64 WAV of the recording (or null)
    rounds: [],       // earlier answers + the feedback the user gave on each
    lastAnswer: null, // the newest answer from the server
    busy: false,
    converting: false, // true while the recording is turned into a WAV
  };

  // ---------- Recording ----------

  let recorder, stream, meterCtx, timerId, startedAt;

  $('mic').onclick = () => (recorder?.state === 'recording' ? stopRecording() : startRecording());

  async function startRecording() {
    showError('');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      return showError('No microphone access. Allow it in your browser settings and try again.');
    }

    // MediaRecorder collects the sound in small pieces ("chunks") until we stop.
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => onRecorded(new Blob(chunks, { type: recorder.mimeType }));
    recorder.start();

    startMeter(stream);
    startedAt = Date.now();
    timerId = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      $('micLabel').textContent = `Recording… ${s}s / ${MAX_SECONDS}s  (tap to stop)`;
      if (s >= MAX_SECONDS) stopRecording();
    }, 200);

    $('mic').classList.add('recording');
    $('mic').textContent = '■';
    $('micLabel').textContent = 'Recording… tap to stop';
  }

  function stopRecording() {
    clearInterval(timerId);
    recorder.stop();
    stream.getTracks().forEach(t => t.stop()); // turns the mic (and the red dot) off
    meterCtx?.close();
    $('mic').classList.remove('recording');
    $('mic').textContent = '🎤';
    $('mic').style.setProperty('--level', 0);
    $('micLabel').textContent = 'Tap to record again';
  }

  // Volume meter: an AnalyserNode lets us read the current sound wave.
  // We compute its average loudness (RMS) every frame and feed it into the CSS glow.
  function startMeter(stream) {
    meterCtx = new AudioContext();
    const analyser = meterCtx.createAnalyser();
    meterCtx.createMediaStreamSource(stream).connect(analyser);
    const wave = new Float32Array(analyser.fftSize);
    const tick = () => {
      if (recorder?.state !== 'recording') return;
      analyser.getFloatTimeDomainData(wave);
      const rms = Math.sqrt(wave.reduce((sum, v) => sum + v * v, 0) / wave.length);
      $('mic').style.setProperty('--level', Math.min(1, rms * 6));
      requestAnimationFrame(tick);
    };
    tick();
  }

  async function onRecorded(blob) {
    $('player').src = URL.createObjectURL(blob);
    $('take').classList.add('show');
    state.converting = true;
    updateFindButton();
    try {
      state.audio = await toWavBase64(blob);
    } catch {
      state.audio = null;
      showError('Could not read the recording. Please try again.');
    }
    state.converting = false;
    updateFindButton();
  }

  $('discard').onclick = () => {
    state.audio = null;
    $('player').removeAttribute('src');
    $('take').classList.remove('show');
    $('micLabel').textContent = `Tap to record (up to ${MAX_SECONDS} s)`;
    updateFindButton();
  };

  // Browsers record in different formats (Chrome: webm, iPhone: mp4).
  // To always send the same thing, we decode the recording and turn it into a
  // small WAV file: 1 channel, 16 000 samples per second, 16-bit. That's plenty for a voice.
  async function toWavBase64(blob) {
    const ctx = new AudioContext();
    const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
    ctx.close();

    // An OfflineAudioContext "plays" the sound into memory instead of the speakers,
    // which resamples it to 16 kHz mono for us.
    const rate = 16000;
    const offline = new OfflineAudioContext(1, Math.ceil(decoded.duration * rate), rate);
    const src = offline.createBufferSource();
    src.buffer = decoded;
    src.connect(offline.destination);
    src.start();
    const samples = (await offline.startRendering()).getChannelData(0);

    // Humming is often quiet, so make the loudest point 90% of full volume.
    const peak = samples.reduce((m, v) => Math.max(m, Math.abs(v)), 0) || 1;
    const gain = 0.9 / peak;

    // A WAV file is a 44-byte header that describes the format, followed by the samples.
    const view = new DataView(new ArrayBuffer(44 + samples.length * 2));
    const text = (pos, s) => [...s].forEach((c, i) => view.setUint8(pos + i, c.charCodeAt(0)));
    text(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true); text(8, 'WAVE');
    text(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    text(36, 'data'); view.setUint32(40, samples.length * 2, true);
    samples.forEach((v, i) => view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v * gain)) * 0x7fff, true));

    // Base64 turns the bytes into text so they fit into JSON. We convert in pieces
    // because String.fromCharCode can't take millions of arguments at once.
    const bytes = new Uint8Array(view.buffer);
    let binary = '';
    for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(binary);
  }

  // ---------- Searching ----------

  $('hint').oninput = updateFindButton;
  function updateFindButton() {
    $('find').disabled = state.busy || state.converting || (!state.audio && !$('hint').value.trim());
  }

  $('find').onclick = () => {
    state.rounds = [];
    $('results').innerHTML = '';
    search();
  };

  $('followup').onsubmit = e => {
    e.preventDefault();
    const feedback = $('feedback').value.trim();
    if (!feedback || state.busy) return;
    $('feedback').value = '';
    state.rounds.push({ answer: state.lastAnswer, feedback });
    $('results').append(el('div', { class: 'bubble' }, feedback));
    search();
  };

  $('reset').onclick = () => {
    state.rounds = [];
    state.lastAnswer = null;
    $('results').innerHTML = '';
    $('hint').value = '';
    $('discard').click();
    $('followup').classList.remove('show');
    $('reset').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  async function search() {
    state.busy = true;
    updateFindButton();
    showError('');
    const thinking = el('div', { class: 'thinking' }, 'Listening');
    $('results').append(thinking);
    thinking.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const started = Date.now();
    const counter = setInterval(() => {
      thinking.textContent = `Listening (${Math.round((Date.now() - started) / 1000)}s)`;
    }, 1000);

    try {
      const res = await fetch('/api/identify', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ audio: state.audio, hint: $('hint').value.trim(), rounds: state.rounds }),
        signal: AbortSignal.timeout(90_000), // never wait more than 90 s
      });
      // If the server function is missing, Cloudflare answers with an HTML page, not JSON.
      const data = await res.json().catch(() => ({}));
      if (res.status === 404) throw new Error('The song finder server (/api/identify) is not deployed. In Cloudflare, set the Root directory to "fottis" and redeploy.');
      if (!res.ok) throw new Error(data.error || `Something went wrong (error ${res.status}).`);
      state.lastAnswer = data;
      thinking.replaceWith(renderAnswer(data));
      $('followup').classList.add('show');
      $('reset').style.display = '';
    } catch (err) {
      thinking.remove();
      if (state.rounds.length) state.rounds.pop(); // let the user resend that feedback
      showError(err.name === 'TimeoutError' ? 'Gemini took too long. Please try again.' : err.message);
    } finally {
      clearInterval(counter);
      state.busy = false;
      updateFindButton();
    }
  }

  function renderAnswer({ heard, guesses = [], question, model }) {
    const box = el('div');
    if (heard) box.append(el('p', { class: 'heard' }, heard));
    if (!guesses.length) box.append(el('p', { class: 'empty' }, 'No idea yet. Add a hint below and try again.'));

    for (const g of guesses) {
      const pct = Math.max(0, Math.min(100, g.confidence || 0));
      const query = encodeURIComponent(`${g.title} ${g.artist}`);
      const foundBtn = el('button', { class: 'small' }, "✓ That's it!");
      foundBtn.onclick = () => {
        saveToHistory(g);
        foundBtn.textContent = '✓ Saved';
        foundBtn.classList.add('found');
        foundBtn.disabled = true;
      };
      box.append(el('div', { class: 'guess' },
        el('div', { class: 'top' },
          el('div', {},
            el('div', { class: 'title' }, g.title),
            el('div', { class: 'artist' }, g.artist + (g.year ? ` · ${g.year}` : ''))),
          el('div', { class: 'pct' }, `${pct}%`)),
        el('div', { class: 'bar' }, el('div', { style: `width:${pct}%` })),
        el('div', { class: 'why' }, g.why || ''),
        el('div', { class: 'links' },
          el('a', { class: 'yt', target: '_blank', rel: 'noopener', href: `https://www.youtube.com/results?search_query=${query}` }, '▶ YouTube'),
          el('a', { class: 'sp', target: '_blank', rel: 'noopener', href: `https://open.spotify.com/search/${query}` }, '♫ Spotify'),
          foundBtn)));
    }
    if (question) box.append(el('p', { class: 'question' }, question));
    if (model) box.append(el('p', { class: 'model' }, `answered by ${model}`));
    return box;
  }

  // ---------- History (saved on this device only) ----------

  const HISTORY_KEY = 'humm-history';

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
  }
  function storeHistory(list) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch {}
    renderHistory();
  }
  function saveToHistory({ title, artist, year }) {
    const list = loadHistory().filter(s => !(s.title === title && s.artist === artist));
    storeHistory([{ title, artist, year, date: Date.now() }, ...list]);
  }

  function renderHistory() {
    const list = loadHistory();
    const ul = $('historyList');
    ul.innerHTML = '';
    if (!list.length) ul.append(el('li', { class: 'empty' }, 'Nothing yet. Tap "That\'s it!" on a guess to keep it here.'));
    list.forEach((s, i) => {
      const query = encodeURIComponent(`${s.title} ${s.artist}`);
      const del = el('button', { class: 'del', 'aria-label': 'Remove' }, '✕');
      del.onclick = () => storeHistory(list.filter((_, j) => j !== i));
      ul.append(el('li', {},
        el('div', { class: 'info' },
          el('div', {}, el('b', {}, s.title), ` – ${s.artist}${s.year ? ` (${s.year})` : ''}`),
          el('div', { class: 'date' }, new Date(s.date).toLocaleDateString())),
        el('div', { class: 'links' },
          el('a', { class: 'yt', target: '_blank', rel: 'noopener', href: `https://www.youtube.com/results?search_query=${query}` }, '▶'),
          el('a', { class: 'sp', target: '_blank', rel: 'noopener', href: `https://open.spotify.com/search/${query}` }, '♫')),
        del));
    });
  }

  // ---------- Helpers ----------

  // Small helper to build HTML elements: el('a', { href: '…' }, 'text', otherElement).
  // Text is added as text (never as HTML), so song names from the AI can't break the page.
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    node.append(...children);
    return node;
  }

  function showError(msg) { $('error').textContent = msg; }

  if (!window.MediaRecorder || !navigator.mediaDevices) {
    $('mic').disabled = true;
    $('micLabel').textContent = 'This browser cannot record. You can still type hints.';
  }
  renderHistory();
</script>
</body>
</html>
