# Einmaliger Prüflauf: Was erlaubt Swisslos, und woher kommen die Sporttip-Quoten?
# Wird nach der Auswertung wieder gelöscht.
name: Probe Sporttip
on:
  push:
    paths: [".github/workflows/probe-sporttip.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: robots.txt
        run: |
          for host in www.swisslos.ch www.sporttip.ch; do
            echo "=== $host/robots.txt"; curl -sSL -m 30 -A "Mozilla/5.0" "https://$host/robots.txt" | head -80 || true
          done
      - name: Startseite und Links zu rechtlichen Seiten
        run: |
          curl -sSL -m 30 -A "Mozilla/5.0" -o home.html -w "%{http_code} %{url_effective}\n" "https://www.swisslos.ch/de/sporttip/home.html" || true
          curl -sSL -m 30 -A "Mozilla/5.0" -o home2.html -w "%{http_code} %{url_effective}\n" "https://www.swisslos.ch/de/home.html" || true
          cat home.html home2.html > all.html
          echo "=== Links (rechtlich)"
          grep -oiE 'href="[^"]*(recht|agb|nutzung|bedingung|teilnahme|impressum|disclaimer|legal)[^"]*"' all.html | sort -u | head -40
          echo "=== Skripte"
          grep -oiE '<script[^>]+src="[^"]+"' all.html | sort -u | head -40
          echo "=== API/JSON-Hinweise"
          grep -oiE '(https?:)?//[a-z0-9.-]*(api|odds|sport|feed|bet)[a-z0-9./_-]*' all.html | sort -u | head -60
          echo "=== Grösse"; wc -c home.html home2.html
      - name: Rechtliche Seiten durchsuchen
        run: |
          for path in $(grep -oiE 'href="[^"]*(recht|agb|nutzung|bedingung|teilnahme|disclaimer|legal)[^"]*"' all.html 2>/dev/null | sed -E 's/href="([^"]*)"/\1/' | sort -u | head -15); do
            case "$path" in http*) url="$path";; /*) url="https://www.swisslos.ch$path";; *) continue;; esac
            echo "=================== $url"
            curl -sSL -m 30 -A "Mozilla/5.0" "$url" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' | grep -oiE '.{0,300}(automat|robot|crawler|scrap|bot[ s]|maschinell|kommerziell|vervielf|systematisch|herunterlad|data mining).{0,300}' | head -12 || true
          done
        continue-on-error: true
