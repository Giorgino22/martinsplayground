# Einmaliger Prüflauf: Was erlaubt Swisslos, und woher kommen die Sporttip-Quoten?
# Wird nach der Auswertung wieder gelöscht.
name: Probe Sporttip
on:
  push:
    paths: [".github/workflows/probe-sporttip.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Bedingungen (PDFs und Seiten)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null 2>&1 || true
          UA="Mozilla/5.0"
          for page in /de/meta/teilnahmebedingungen/teilnahmebedingungen.html /de/meta/impressum/impressum.html /de/informationen/ueber-swisslos/rechtlicher-rahmen/rechtlicher-rahmen.html; do
            echo "########## $page"
            curl -sSL -m 30 -A "$UA" "https://www.swisslos.ch$page" -o page.html
            grep -oiE 'href="[^"]*\.pdf[^"]*"' page.html | sort -u | head -30
            sed -e 's/<[^>]*>/ /g' page.html | tr -s ' \n' | grep -oiE '.{0,200}(nutzungsbedingung|automat|robot|crawler|scrap|maschinell|kommerziell|systematisch|urheber|vervielf).{0,250}' | head -10
          done
          for pdf in $(curl -sSL -m 30 -A "$UA" "https://www.swisslos.ch/de/meta/teilnahmebedingungen/teilnahmebedingungen.html" | grep -oiE 'href="[^"]*\.pdf' | sed -E 's/href="//' | sort -u | grep -iE 'sport|allgemein|online|internet|nutzung|teilnahme' | head -8); do
            case "$pdf" in http*) url="$pdf";; *) url="https://www.swisslos.ch$pdf";; esac
            echo "========== PDF $url"
            curl -sSL -m 60 -A "$UA" "$url" -o doc.pdf && pdftotext -q doc.pdf doc.txt && wc -w doc.txt
            tr -s ' \n' ' ' < doc.txt | grep -oiE '.{0,250}(automat|robot|crawler|scrap|software|maschinell|kommerziell|systematisch|technische hilfsmittel|programm|missbrauch).{0,300}' | head -12
          done
      - name: Admiral-Schnittstelle
        continue-on-error: true
        run: |
          UA="Mozilla/5.0"
          echo "=== sitemap"; curl -sSL -m 30 -A "$UA" "https://api.ch.admiral.at/api/sports/integration/sitemap/sitemap-ch-sl.xml" | head -c 1500; echo
          curl -sSL -m 30 -A "$UA" "https://static.ch.admiral.at/mfo/asw.b2b.sports.ui.widget/bootstrap.js" -o boot.js; wc -c boot.js
          echo "=== URLs im Widget"; grep -oE 'https?://[a-zA-Z0-9.-]*admiral[a-zA-Z0-9./_-]*' boot.js | sort -u | head -40
          grep -oE '"/api/[a-zA-Z0-9/_.{}-]*"' boot.js | sort -u | head -60
          curl -sSL -m 30 -A "$UA" "https://www.swisslos.ch/media/tech/admiral/asw-web/script.umd.js?v=107" -o asw.js; wc -c asw.js
          echo "=== URLs in asw-web"; grep -oE 'https?://[a-zA-Z0-9.-]*admiral[a-zA-Z0-9./_-]*' asw.js | sort -u | head -40
          grep -oE '["'"'"'`]/api/[a-zA-Z0-9/_.{}$-]*' asw.js | sort -u | head -60
